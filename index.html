<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mie Ayam & Sosis Mbak Tri</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #1a1a1a;
            --text-dark: #ffffff;
            --bg-light: #ffffff;
            --text-light: #000000;
        }

        /* Terapkan font Bree Serif */
        h1, h2, h3, .lead, .btn {
            font-family: 'Bree Serif', serif !important;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-light);
            transition: all 0.3s ease;
        }

        body[data-bs-theme="dark"] {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        .social-link {
            transition: transform 0.3s ease;
        }

        .social-link:hover {
            transform: translateY(-3px);
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            cursor: pointer;
            z-index: 1000;
        }
    </style>
</head>
<body data-bs-theme="dark">
    <div class="theme-toggle">
        <button class="btn btn-outline-secondary" onclick="toggleTheme()">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center py-5">
        <div class="text-center mb-4">
            <img src="assets/images/profile.jpg" alt="Mie Ayam & Sosis Mbak Tri" class="profile-img mb-3">
            <h1 class="mb-3">Mie Ayam & Sosis Mbak Tri</h1>
            <p class="lead">Untuk Pemesanan klik link berikut:</p>
        </div>

        <div class="w-100" style="max-width: 400px;">
            <div class="d-grid gap-3">
                <a href="https://api.whatsapp.com/send?phone=6281326477333" target="_blank" class="btn btn-success btn-lg social-link">
                    <i class="fab fa-whatsapp"></i> WhatsApp
                </a>

                <a href="https://order.mbaktri.my.id" target="_blank" class="btn btn-primary btn-lg social-link">
                    <i class="fab fa-book-open"></i> Menu & Order
                </a>
                
                <a href="https://shopee.co.id/universal-link/now-food/shop/20614746" target="_blank" class="btn btn-danger btn-lg social-link">
                    <i class="fas fa-shopping-bag"></i> ShopeeFood
                </a>
                
                <a href="https://goo.gl/maps/D46stwgt7y8M9J4EA" target="_blank" class="btn btn-primary btn-lg social-link">
                    <i class="fas fa-map-marker-alt"></i> Google Maps
                </a>
                
                <a href="https://api.whatsapp.com/send?text=Bayar Via QRIS kak&phone=6281326477333" target="_blank" class="btn btn-warning btn-lg social-link">
                    <i class="fas fa-qrcode"></i> Bayar Via QRIS
                </a>
            </div>
        </div>

        <footer class="mt-5 text-muted">
            <p>&copy; Since 2022</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleTheme() {
            const body = document.body;
            const themeToggleBtn = document.querySelector('.theme-toggle button');
            
            if (body.getAttribute('data-bs-theme') === 'dark') {
                body.setAttribute('data-bs-theme', 'light');
                themeToggleBtn.innerHTML = '<i class="fas fa-moon"></i>';
                localStorage.setItem('theme', 'light');
            } else {
                body.setAttribute('data-bs-theme', 'dark');
                themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
                localStorage.setItem('theme', 'dark');
            }
        }

        // Load saved theme
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.body.setAttribute('data-bs-theme', savedTheme);
        document.querySelector('.theme-toggle button').innerHTML = 
            savedTheme === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    </script>
</body>
</html>
